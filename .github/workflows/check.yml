name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Required for the merge queue: GitHub builds each queued PR as a temporary
  # gh-readonly-queue/ candidate and fires merge_group; the required `check`
  # status must run there or queued PRs never merge.
  merge_group:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope: this workflow only checks out and builds/tests the repo.
permissions:
  contents: read

jobs:
  # Cheap gate: decide whether anything outside docs/ changed. docs/ is prose
  # (excluded from the lint checks) and can't affect the build or tests, so a
  # docs-only change skips the expensive macOS job below.
  #
  # Why a skipped job rather than `paths-ignore`: `check` is a required status
  # check on main. `paths-ignore` filters the whole workflow, so the required
  # context is never reported and the PR stays stuck "Expected". A job skipped
  # via `if:` still reports — branch protection treats a skipped required check
  # as passing — so docs-only PRs stay mergeable.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          fetch-depth: 0
          persist-credentials: false
      - name: Detect non-docs changes
        id: filter
        working-directory: blurt
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          else
            range="" # first push / unknown base: run the full check to be safe
          fi
          if [ -z "$range" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"; exit 0
          fi
          # `|| true` is the safety property, not tidiness: this step runs under
          # `bash -e`, so a failing git diff (an unreachable base sha after a
          # force-push, a fork edge case) fails the step, fails this job, and makes
          # the `check` job SKIP — which GitHub reports to branch protection as a
          # passing required check. The entire macOS gate would be bypassed on a
          # green-looking PR. An empty `changed` falls through to code=true below,
          # so failing open runs the full check instead.
          changed="$(git diff --name-only "$range" || true)"
          echo "Changed files in $range:"; echo "$changed"
          # Capture non-docs lines and test emptiness (robust across grep impls).
          nondocs="$(printf '%s\n' "$changed" | grep -vE '^docs/' || true)"
          if [ -z "$changed" ] || [ -n "$nondocs" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"  # something outside docs/ changed
          else
            echo "code=false" >>"$GITHUB_OUTPUT" # docs-only — skip the heavy job
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install build tools
        working-directory: blurt
        run: brew bundle --file=Brewfile

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run check.sh
        working-directory: blurt
        run: scripts/check.sh

  # Every PR gets an installable build of the change, so a reviewer can try it
  # instead of reading the diff and imagining it. Deliberately NOT part of the
  # required gate (`gate` below ignores it): it builds the same sources `check`
  # already compiles, so a failure here is never the only signal.
  #
  # The download link is posted on the PR by the `pr-dev-build` workflow — a
  # pull_request run from a fork gets a read-only token and cannot comment, so
  # that step has to happen in a workflow_run job. This one only produces the
  # artifact, and names it with the PR number so the follow-up knows where to
  # post (github.event.workflow_run.pull_requests is empty for forks).
  dev-build:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Build Blurt.app (Debug-Local, ad-hoc signed)
        working-directory: blurt/App/Blurt
        # Debug-Local is the configuration scripts/dev-build.sh uses: a debug
        # build with UITEST_HOOKS off, so this is the real app rather than the
        # test-harness variant. The committed .xcodeproj is used as-is — check's
        # xcodegen drift check is what guarantees it matches project.yml.
        #
        # Ad-hoc signing (identity "-", signing ALLOWED), the same recipe
        # uitest.sh uses: the Developer ID cert isn't on this runner, and the
        # "Install to /Applications" post-build script skips itself under "-".
        run: |
          xcodebuild \
            -project Blurt.xcodeproj \
            -scheme Blurt \
            -configuration Debug-Local \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/devbuild" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package the app
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/devbuild/Build/Products/Debug-Local/Blurt.app"
          [ -d "$app" ] || { echo "::error::no app at $app"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          # ditto, not zip: it preserves the bundle layout, symlinks, and the
          # executable bit the way macOS expects when the zip is expanded again.
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/out/Blurt-dev-${SHA:0:7}.zip"

      - name: Upload the dev build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # The PR number in the name is how pr-dev-build.yml finds the PR.
          name: blurt-dev-build-pr-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/out/*.zip
          if-no-files-found: error
          # A dev build is only interesting while the PR is open.
          retention-days: 14

      - name: Summarize
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo "### Dev build"
            echo
            echo "Blurt.app from this PR (\`${SHA:0:7}\` merged into the base branch),"
            echo "built \`Debug-Local\` and ad-hoc signed."
            echo "Download it from the **Artifacts** section of this run, then:"
            echo
            echo '```sh'
            echo "unzip ~/Downloads/blurt-dev-build-pr-*.zip -d ~/Downloads"
            echo "unzip ~/Downloads/Blurt-dev-${SHA:0:7}.zip -d ~/Downloads"
            echo "xattr -dr com.apple.quarantine ~/Downloads/Blurt.app"
            echo "rm -rf /Applications/Blurt.app && cp -R ~/Downloads/Blurt.app /Applications/"
            echo '```'
            echo
            echo "It is **ad-hoc signed and not notarized**, so Gatekeeper refuses it until"
            echo "the quarantine flag is cleared, and macOS treats it as a different app from"
            echo "a released Blurt — re-grant Microphone, Accessibility, and Input Monitoring,"
            echo "and reinstall the release DMG when you're done reviewing."
          } >>"$GITHUB_STEP_SUMMARY"

  # Always-runs summary job, so a *skipped* `check` can't be mistaken for a pass.
  # GitHub reports a skipped required check to branch protection as successful, so
  # anything that makes `check` skip — the `changes` filter erroring, a `needs`
  # failure — silently bypasses the entire macOS gate on a green-looking PR.
  # This job runs `if: always()` and fails unless `check` either succeeded or was
  # skipped *by the docs-only design* (changes.outputs.code == 'false').
  #
  # NOTE: this only protects the repo once branch protection requires `gate`
  # instead of (or as well as) `check` — that's a repo settings change.
  gate:
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert the macOS gate ran or was intentionally skipped
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$CHANGES_RESULT code=$CODE_CHANGED check=$CHECK_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "error: the changes filter did not succeed, so the gate cannot be trusted" >&2
            exit 1
          fi
          case "$CHECK_RESULT" in
            success) echo "macOS gate passed" ;;
            skipped)
              if [ "$CODE_CHANGED" = "false" ]; then
                echo "docs-only change; macOS gate intentionally skipped"
              else
                echo "error: check was skipped but code changed" >&2
                exit 1
              fi
              ;;
            *) echo "error: macOS gate result was '$CHECK_RESULT'" >&2; exit 1 ;;
          esac
