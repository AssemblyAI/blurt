name: pr-dev-build

# Post the dev-build download link as a comment on the PR that produced it.
#
# Why this is a separate workflow rather than a step in `check`: a
# `pull_request` run triggered from a fork gets a read-only GITHUB_TOKEN, so it
# cannot comment — and forks are the normal path for outside contributors, who
# are exactly the people most helped by a one-click build. A `workflow_run` job
# runs from the default branch with the repository's own token, so every PR gets
# the link, fork or not.
#
# That extra trust is why this job never checks out or executes any PR code. It
# reads the triggering run's artifact list over the API and writes one comment,
# nothing else. Note that `workflow_run` only fires for the copy of this file on
# the default branch, so edits here take effect after they merge.
#
# zizmor flags `workflow_run` as fundamentally insecure, which is the right
# default: the trigger is dangerous precisely because it pairs a writable token
# with a run whose inputs an outside contributor influenced. It is suppressed
# here because the two conditions that make it exploitable are both absent —
# there is no `actions/checkout` in this file (so no PR code is fetched, let
# alone executed), and every attacker-influenced value reaches the shell through
# `env:` rather than a `${{ }}` interpolation, so none of it can be parsed as
# shell. Re-audit this suppression if either ever changes.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment the dev build link
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # No artifact means the dev-build job didn't run (a docs-only PR) or
          # didn't finish. Nothing to say — leave the PR alone.
          artifact="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.expired == false)
                   | select(.name | startswith("blurt-dev-build-pr-"))] | first // empty')"
          if [ -z "$artifact" ]; then
            echo "no dev-build artifact on run $RUN_ID — nothing to post"
            exit 0
          fi

          artifact_id="$(printf '%s' "$artifact" | jq -r .id)"
          artifact_name="$(printf '%s' "$artifact" | jq -r .name)"
          # check.yml names the artifact blurt-dev-build-pr-<number> precisely so
          # this is derivable: github.event.workflow_run.pull_requests is empty
          # for a run that came from a fork.
          pr="${artifact_name##*-}"
          case "$pr" in
            '' | *[!0-9]*)
              echo "::error::could not read a PR number out of artifact name '$artifact_name'"
              exit 1
              ;;
          esac

          short_sha="$(printf '%.7s' "$HEAD_SHA")"
          url="https://github.com/$REPO/actions/runs/$RUN_ID/artifacts/$artifact_id"

          # The marker is how the next push finds this comment and edits it in
          # place, so a long-running PR carries one link that stays current
          # rather than a stack of stale ones.
          marker="<!-- blurt-dev-build -->"
          body="$(mktemp)"
          cat >"$body" <<EOF
          $marker
          ### Dev build

          [**Download Blurt.app**]($url) — this PR (\`$short_sha\`) merged into the base
          branch, built \`Debug-Local\` and ad-hoc signed. Expires in 14 days.

          <details>
          <summary>Installing it</summary>

          \`\`\`sh
          cd ~/Downloads
          unzip -o $artifact_name.zip   # GitHub wraps every artifact in a zip
          unzip -o Blurt-dev-$short_sha.zip
          xattr -dr com.apple.quarantine Blurt.app
          rm -rf /Applications/Blurt.app && cp -R Blurt.app /Applications/
          open -a Blurt
          \`\`\`

          It is **ad-hoc signed and not notarized**: Gatekeeper refuses to open it until
          the quarantine flag is cleared, and macOS treats it as a different app from a
          released Blurt, so you have to re-grant Microphone, Accessibility, and Input
          Monitoring. Reinstall the [release DMG](https://github.com/$REPO/releases/latest)
          when you are done reviewing.

          </details>
          EOF

          # jq's `first` over each page, rather than `| head -1`: closing the pipe
          # early would SIGPIPE gh, and under `set -o pipefail` that is a failure.
          existing="$(gh api "repos/$REPO/issues/$pr/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | first // empty")"
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$body" >/dev/null
            echo "updated comment $existing on PR #$pr"
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -F "body=@$body" >/dev/null
            echo "commented on PR #$pr"
          fi
