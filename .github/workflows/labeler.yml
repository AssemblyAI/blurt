name: labeler

# Labels each PR by the parts of the repo it touches (rules in
# .github/labeler.yml), so the PR list can be filtered by area and a reviewer
# can see at a glance whether a change reaches the engine, an app, or only CI.
#
# pull_request_target, not pull_request: a fork's pull_request token is
# read-only and can't add a label. That trigger runs with the base repo's token,
# which is safe here only because nothing from the PR is checked out or run —
# the action reads the changed-file list from the API and the rules from the
# base branch. Don't add a checkout or a `run:` step to this workflow.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code runs; see above
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          # Only add: a label a maintainer set by hand stays when a later push
          # no longer touches that area.
          sync-labels: false
