version: 2
updates:
  # Keep the SHA-pinned GitHub Actions from rotting: Dependabot opens a PR
  # (with a new SHA + version comment) when a pinned action publishes a release.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
  # check.sh's copy/paste detector, pinned by tools/jscpd's lockfile. A bump is a
  # PR so CI shows whether the new tokenizer finds clones the old one didn't.
  - package-ecosystem: npm
    directory: "/tools/jscpd"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
