name: check

on:
  pull_request:
    branches: [main]
  # Required for the merge queue: GitHub builds each queued PR as a temporary
  # gh-readonly-queue/ candidate and fires merge_group; the required `check`
  # status must run there or queued PRs never merge.
  merge_group:
  # No `push` to main: main only moves through the merge queue, which advances
  # it to the very commit its merge group just passed `check` on — a push run
  # tested that commit a second time, on ~10 macOS runners per merge. Dispatch
  # by hand to check main (or any branch) outside a PR; that runs every gate.
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# Minimal token scope: this workflow only checks out and builds/tests the repo.
permissions:
  contents: read

jobs:
  # Cheap gate: decide what kind of change this is, so each job runs only when it
  # can find something.
  #   code  — anything outside docs/. docs/ is prose (excluded from the lint
  #           checks) and can't affect the build or tests, so a docs-only change
  #           skips every macOS job below.
  #   swift — anything outside docs/ and evals/, plus evals/**/*.json. An
  #           evals-only change (a prompt harness, a scorer, their config) can't
  #           move a Swift build or test, so it runs only `lint` — which carries
  #           ruff, mypy and the pytest coverage gate — and skips the ~37-minute
  #           Swift/iOS jobs. The JSON is the one exception: PlannerEvalTests
  #           reads evals/command-planner/cases.json as a fixture.
  #
  # Why a skipped job rather than `paths-ignore`: `check` is a required status
  # check on main. `paths-ignore` filters the whole workflow, so the required
  # context is never reported and the PR stays stuck "Expected". A job skipped
  # via `if:` still reports, and the required `check` (the summary job at the
  # bottom) accepts a skip the filter intended — so docs-only PRs stay mergeable.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          fetch-depth: 0
          persist-credentials: false
      - name: Detect non-docs changes
        id: filter
        working-directory: blurt
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # A merge group is its PR(s) on top of `base_sha` (main, or the group
          # ahead in the queue), so `base..head` is exactly what the group adds.
          # Without it every queued PR ran the full ~40 minutes, docs-only ones
          # included, though the same PR had skipped them as a pull_request.
          if [ "$EVENT" = "pull_request" ]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif [ "$EVENT" = "merge_group" ] && [ -n "${QUEUE_BASE_SHA:-}" ] \
            && git cat-file -e "${QUEUE_BASE_SHA}^{commit}" 2>/dev/null; then
            range="$QUEUE_BASE_SHA..$HEAD_SHA"
          else
            range="" # a dispatch, or an unknown base: run the full check to be safe
          fi
          if [ -z "$range" ]; then
            { echo "code=true"; echo "swift=true"; } >>"$GITHUB_OUTPUT"; exit 0
          fi
          # `|| true` is the safety property, not tidiness: this step runs under
          # `bash -e`, so a failing git diff (an unreachable base sha after a
          # force-push, a fork edge case) fails the step, fails this job, and makes
          # every gate below SKIP — which GitHub reports as passing. The required
          # `check` catches that (it fails when `changes` did not succeed), but an
          # empty `changed` failing open is the first line of defence. An empty `changed` falls through to code=true below,
          # so failing open runs the full check instead.
          changed="$(git diff --name-only "$range" || true)"
          echo "Changed files in $range:"; echo "$changed"
          # Capture non-docs lines and test emptiness (robust across grep impls).
          nondocs="$(printf '%s\n' "$changed" | grep -vE '^docs/' || true)"
          if [ -z "$changed" ] || [ -n "$nondocs" ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"  # something outside docs/ changed
          else
            echo "code=false" >>"$GITHUB_OUTPUT" # docs-only — skip the heavy job
          fi
          # Same fail-open shape: an empty `changed` counts as Swift.
          swiftish="$(printf '%s\n' "$nondocs" \
            | awk 'NF && (!/^evals\// || /\.json$/)' || true)"
          if [ -z "$changed" ] || [ -n "$swiftish" ]; then
            echo "swift=true" >>"$GITHUB_OUTPUT"
          else
            echo "swift=false" >>"$GITHUB_OUTPUT" # docs/evals only — lint covers it
          fi

  # The read-only checks alone (`check.sh --lint-only`: swift-format, swiftlint,
  # jscpd, design-sync, the invariants, the shell/workflow/Markdown linters, ruff,
  # pytest, …), so their findings turn the PR red in minutes. `macos` runs the
  # same checks first but, by design, carries on through the build, the tests
  # and periphery before its exit trap reports — in the month this
  # job was added for, every red `check` run (then all of check.sh) was one of these checks, surfacing
  # 30–39 minutes in. `macos` keeps running them too, so it stays a complete
  # answer on its own; this job only moves the bad news earlier. It is also the
  # only job an evals-only change runs (see `changes`).
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install build tools
        working-directory: blurt
        run: brew bundle --file=Brewfile

      - name: Install jscpd
        working-directory: blurt
        run: npm ci --prefix tools/jscpd

      - name: Install the evals' Python tools
        working-directory: blurt
        run: uv sync --project evals --locked

      - name: Run check.sh --lint-only
        working-directory: blurt
        env:
          CI: "true"
        run: scripts/check.sh --lint-only

      - name: Run the evals' DSPy test
        # test_eval.py's one test that needs DSPy, which the locked dev
        # environment (evals/uv.lock) leaves out, so check.sh's pytest skips it
        # on every machine. Here it runs with DSPy in the range the harness's
        # own script declares (optimize_cleanup_prompt.py's inline metadata),
        # and the step fails unless it passed rather than skipped. Python 3.14,
        # not the runner's newest: GEPA, which DSPy brings and the harness
        # imports, supports nothing past 3.14.
        working-directory: blurt/evals
        run: |
          set -o pipefail
          uv run --python 3.14 --locked --with 'dspy>=3.0,<3.5' --with gepa pytest dictation-prompt/test_eval.py \
            -k test_a_failing_example_still_advances_the_meter 2>&1 | tee "$RUNNER_TEMP/dspy-test.log"
          grep -q '1 passed' "$RUNNER_TEMP/dspy-test.log"

  # The full check.sh on macOS — engine tests, coverage, sanitizers, the app
  # build — minus the whole-app integration steps, which `ui-tests` runs in
  # parallel, and swiftlint analyze and periphery, which `mac-static` does.
  # (This job was `check` until the required status moved to the summary job at
  # the bottom; see there.)
  macos:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    # ~11 minutes without the UI suite, analyze and periphery (Nov 2026); 30
    # leaves headroom for a slow runner.
    timeout-minutes: 30

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install build tools
        working-directory: blurt
        run: brew bundle --file=Brewfile

      # check.sh's copy/paste gate, installed from its lockfile (tools/jscpd) rather
      # than the Brewfile so every machine runs the one release: the tokenizer
      # decides what counts as a clone. check.sh finds it in tools/jscpd itself.
      - name: Install jscpd
        working-directory: blurt
        run: npm ci --prefix tools/jscpd

      # ruff, mypy, pytest and coverage.py for the evals, from evals/uv.lock —
      # coverage has to share pytest's interpreter, which no Homebrew formula
      # offers. check.sh finds evals/.venv itself.
      - name: Install the evals' Python tools
        working-directory: blurt
        run: uv sync --project evals --locked

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run check.sh
        working-directory: blurt
        # BLURT_INTEGRATION_TESTS=0 skips the XCUITest suite and the leak scan,
        # which CI would otherwise run here: `ui-tests` runs them on a runner of
        # its own, in parallel, and the required `check` job fails unless it
        # passed. Drop the variable only together with that job.
        #
        # BLURT_STATIC_CHECKS=0 likewise skips `swiftlint analyze` and periphery,
        # which `mac-static` runs on a runner of its own; the required `check`
        # job fails unless it passed. Drop it only together with that job.
        env:
          CI: "true"
          BLURT_INTEGRATION_TESTS: "0"
          BLURT_STATIC_CHECKS: "0"
        run: scripts/check.sh

  # The Mac app's static gates: `swiftlint analyze` (every analyzer rule) over
  # the app build's compiler log, then periphery's own build and scan —
  # scripts/mac-static.sh, the same steps check.sh runs after its app build. A
  # job of its own, beside `macos`, as ios-static is beside ios-build: on that
  # runner they were ~10 of its ~21 minutes (Nov 2026), and they need nothing
  # it produces but the build, which takes ~2 minutes to repeat here.
  mac-static:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    # ~13 minutes (Nov 2026): the build, analyze, periphery; 30 for a slow
    # runner.
    timeout-minutes: 30

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install the Mac static gates' tools
        # xcodegen for the project (generated, not committed), swiftlint for
        # `swiftlint analyze`, periphery for the unused-code scan, xcbeautify for
        # the build output; all in the Brewfile too, so these are the versions
        # check.sh uses.
        run: brew install xcodegen swiftlint periphery xcbeautify

      - name: Build the Mac app, then run swiftlint analyze and periphery
        working-directory: blurt
        run: scripts/mac-static.sh

  # The whole-app integration steps check.sh runs under CI: the XCUITest suite
  # (scripts/uitest.sh — 69 tests driving every trigger key, read-aloud and the
  # audits end to end, ~20 minutes of test) and the leak scan (scripts/leaks.sh).
  # A job of its own: it needs nothing the `macos` job produces — both scripts
  # generate the project and build the app themselves.
  #
  # Two runners, by test class, balanced on CI's per-class times (Nov 2026: ~580
  # and ~600 s): shard a runs the classes it names and the leak scan; shard b
  # skips those classes, so a new class lands in b with no list to update, and
  # a renamed one still runs there (uitest.sh fails a selection that ran
  # nothing).
  ui-tests:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    # ~14 minutes per shard (Nov 2026); 30 for a slow runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            leaks: true
            selection: >-
              -only-testing:BlurtUITests/KeysAndReadAloudUITests
              -only-testing:BlurtUITests/SettingsUITests
              -only-testing:BlurtUITests/APIKeySheetUITests
              -only-testing:BlurtUITests/CommandPipelineUITests
              -only-testing:BlurtUITests/MenuBarUITests
              -only-testing:BlurtUITests/LaunchPerformanceUITests
          - shard: b
            leaks: false
            selection: >-
              -only-testing:BlurtUITests
              -skip-testing:BlurtUITests/KeysAndReadAloudUITests
              -skip-testing:BlurtUITests/SettingsUITests
              -skip-testing:BlurtUITests/APIKeySheetUITests
              -skip-testing:BlurtUITests/CommandPipelineUITests
              -skip-testing:BlurtUITests/MenuBarUITests
              -skip-testing:BlurtUITests/LaunchPerformanceUITests

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install xcodegen and xcbeautify
        # Both scripts generate the project (it isn't committed), then need only
        # Xcode; they fall back to raw output without xcbeautify.
        run: brew install xcodegen xcbeautify

      - name: Run the XCUITest suite (shard ${{ matrix.shard }})
        working-directory: blurt
        env:
          # Where scripts/uitest.sh writes the UI suite's result bundle, for
          # the upload below.
          BLURT_UITEST_RESULTS: ${{ runner.temp }}/BlurtUITests.xcresult
          SELECTION: ${{ matrix.selection }}
        run: |
          read -ra selection <<<"$SELECTION"
          scripts/uitest.sh "${selection[@]}"

      - name: Run the whole-app leak scan
        if: matrix.leaks
        working-directory: blurt
        run: scripts/leaks.sh

      # The UI suite's result bundle when the job fails or times out: the log
      # shows each failure's first line only, and the bundle has the rest — every
      # accessibility issue an audit raised, and the screenshots the test plan
      # keeps.
      - name: Upload the UI suite's results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BlurtUITests-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/BlurtUITests.xcresult
          if-no-files-found: ignore

  # Fast-fail typecheck. `macos` above is the authority on green and this job can
  # only go red where `macos` would too — so it is deliberately NOT required, and
  # the summary `check` job ignores it.
  #
  # It exists for latency. The web sandbox has no Swift toolchain (macOS-only
  # project; the Linux toolchain isn't reachable under the default network
  # policy), so CI is the first compiler to see any Swift change, and a test
  # target that doesn't build is the single most common way a PR here goes red —
  # PRs #122 and #124 each burned three consecutive red runs on one compile error
  # at a time. `macos` reaches that error only after the engine suite starts, and
  # a full run is ~11 minutes. Building just the engine and its tests reports the
  # same error in ~2, which is the whole point.
  compile:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 15

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Build the engine and its tests
        working-directory: blurt
        # --build-tests compiles the test targets without running them, so this is
        # a typecheck of Tests/ as well as Sources/. -warnings-as-errors matches
        # what check.sh passes, so a warning can't pass here and fail there. No
        # xcodegen, no app build, no sanitizers, no coverage — those stay in
        # `macos`, and duplicating any of them here would spend the latency this
        # job is meant to save.
        run: swift build --build-tests -Xswiftc -warnings-as-errors

  # The engine suites that need this Mac's hardware, which every other job
  # skips: Control Your Mac's real performer against a real window
  # (`LivePerformerTests`, on the CommandFixture app: every press, value,
  # selection, menu item, scroll and window move judged by the state the
  # fixture records) and the three live-audio suites (`MicCaptureLevelsTests`,
  # `AudioInputDevicesTests`, `MicCaptureBringUpTests`: device enumeration, a
  # real AVCaptureSession's levels, its bring-up and teardown). Everywhere else
  # these paths are stubs, or their decisions are tested without the system
  # calls, so this is the one gate that makes them.
  #
  # They drive the machine they run on, so each asks to (`BLURT_LIVE_AX_TESTS=1`,
  # `BLURT_LIVE_AUDIO_TESTS=1`); a throwaway runner is the safe place. GitHub's
  # macOS image grants the runner's processes Accessibility and Microphone
  # trust, but has no live input, so a loopback device (BlackHole) is
  # installed and fed noise first: the capture path rejects a silent input by
  # design, so the suites need a signal. A missing gate *skips* a suite and
  # `swift test`
  # still exits 0, so the step passes only if every suite reports it passed.
  # The fixture recorders (`ScreenTreeRecorder`, `PasteFixtureRecorder`) are
  # tools that drive the user's own apps to write fixtures, not tests, and stay
  # manual.
  live-tests:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    # ~6 minutes: the driver, the engine's test build, then suites of seconds.
    timeout-minutes: 20

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install a virtual microphone and feed it sound
        # BlackHole, a loopback Core Audio driver: whatever plays to its output
        # comes back on its input. coreaudiod loads it only on a restart, which
        # launchd does at once. It then becomes the default input and output,
        # and 30 s of low-level white noise is written for the next step to
        # loop into it: the capture path rejects a silent input by design (an
        # input that never delivers, or reads below
        # `MicLiveness.silenceFloorDB`), so the capture tests need a signal,
        # not just a device. Noise rather than speech: speech has exact-zero
        # gaps a short capture can land in.
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod || true
          for _ in $(seq 1 30); do
            SwitchAudioSource -a -t input | grep -q 'BlackHole 2ch' && break
            sleep 1
          done
          SwitchAudioSource -t input -s 'BlackHole 2ch'
          SwitchAudioSource -t output -s 'BlackHole 2ch'
          echo "input: $(SwitchAudioSource -c -t input); output: $(SwitchAudioSource -c -t output)"
          noise="$RUNNER_TEMP/noise.wav"
          python3 - "$noise" <<'PY'
          import random, struct, sys, wave
          with wave.open(sys.argv[1], "wb") as out:
              out.setnchannels(1); out.setsampwidth(2); out.setframerate(48000)
              out.writeframes(b"".join(struct.pack("<h", random.randint(-2000, 2000)) for _ in range(48000 * 30)))
          PY

      - name: Run the live performer and live-audio suites
        working-directory: blurt
        env:
          BLURT_LIVE_AX_TESTS: "1"
          BLURT_LIVE_AUDIO_TESTS: "1"
        # Two passes over one test build. BlackHole's input and output are one
        # device, so while noise plays into it the device reads as running —
        # exactly what "building a recorder leaves the microphone closed"
        # asserts it is not. So the suites that need the device idle run first,
        # in quiet, and the two that need a signal run with the noise playing.
        run: |
          set -euo pipefail
          quiet="$RUNNER_TEMP/live-quiet.log"
          signal="$RUNNER_TEMP/live-signal.log"
          swift test --filter 'LivePerformerTests|AudioInputDevicesTests|MicCaptureBringUpTests' \
            --skip pinnedRecorderCapturesAudio 2>&1 | tee "$quiet"
          bash -c "while true; do afplay '$RUNNER_TEMP/noise.wav'; done" &
          player=$!
          trap 'kill "$player" 2>/dev/null || true; pkill -x afplay || true' EXIT
          swift test --filter 'MicCaptureLevelsTests|pinnedRecorderCapturesAudio' 2>&1 | tee "$signal"
          missing=0
          check() {
            if ! grep -qF "Suite \"$2\" passed" "$1"; then
              echo "::error::Suite \"$2\" did not run and pass (see its skip reason above)"
              missing=1
            fi
          }
          check "$quiet" "Live performer"
          check "$quiet" "MicCapture bring-up (live)"
          check "$quiet" "AudioInputDevices & capture session (live)"
          check "$signal" "MicCapture.levels (live)"
          check "$signal" "AudioInputDevices & capture session (live)"
          exit "$missing"

  # What swift-format would change, as an applicable patch. Formatting is the
  # other half of what CI is sole authority over here, and `macos` can only say
  # *that* a file is misformatted (`swift-format lint --strict`) — leaving the
  # author to reproduce the reflow by hand, blind, with no formatter on the
  # machine they're editing from. Several PRs paid for that in commits of the form
  # "Format X the way swift-format wants".
  #
  # So: run the formatter for real and publish the diff. Read-only and advisory —
  # it never fails the build (`macos` already does that) and never pushes, which
  # keeps this job free of a writable token while it holds PR code. Applying the
  # patch stays a deliberate act by the author:
  #   gh run download <id> -n swift-format-patch && git apply swift-format.patch
  format-patch:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Format every tracked Swift file and diff the result
        id: diff
        working-directory: blurt
        # Same file set and same tool as check.sh's lint step (xcrun swift-format,
        # bundled with Xcode), so the patch is exactly what would make that step
        # pass. `git diff` after an in-place format is the patch; an empty diff
        # means the tree is already clean and there is nothing to publish.
        run: |
          set -euo pipefail
          git ls-files -z -- '*.swift' | xargs -0 xcrun swift-format format --in-place
          if git diff --quiet; then
            echo "swift-format would change nothing." >>"$GITHUB_STEP_SUMMARY"
            echo "dirty=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "dirty=true" >>"$GITHUB_OUTPUT"
          git diff >"$RUNNER_TEMP/swift-format.patch"
          {
            echo "### swift-format would reformat these files"
            echo
            echo '```console'
            git diff --stat
            echo '```'
            echo
            echo "Apply with \`git apply swift-format.patch\` from the artifact below."
            echo
            echo "<details><summary>Full patch</summary>"
            echo
            echo '```diff'
            cat "$RUNNER_TEMP/swift-format.patch"
            echo '```'
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the patch
        if: steps.diff.outputs.dirty == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-format-patch
          path: ${{ runner.temp }}/swift-format.patch
          if-no-files-found: error
          retention-days: 14

  # The engine is a two-platform package, and `macos` only ever compiles it for
  # macOS: `swift test` builds for the host, and every job above runs on one.
  # A macOS-only symbol that escapes its `#if os(macOS)` fence therefore passes
  # `macos` and breaks the iOS app, which is why this job exists and why the
  # required `check` job asserts it. It builds the library alone, for the
  # simulator SDK — `xcodebuild` rather than `swift build`, because
  # cross-compiling needs the SDK/destination handling xcodebuild owns, and it
  # resolves the package
  # straight from the checkout, no project needed. `generic/platform=iOS
  # Simulator` builds against the runner's default (latest installed) simulator
  # SDK without naming a device or pinning an iOS version. The schemes are the
  # package's own `BlurtEngine` and `BlurtAssemblyAI` product schemes, so only
  # the libraries build; the test target stays a macOS (`swift test`) concern.
  ios-build:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    # The engine's simulator build, then the iPhone unit tests with BlurtiOSCore's
    # coverage gate and the probe's build: ~13 minutes once the audits, analyze
    # and periphery moved to ios-audits and ios-static (together this job took
    # 40–48 minutes, check.yml's long pole, Nov 2026). 30 leaves headroom for a
    # slow runner's first simulator boot.
    timeout-minutes: 30

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Build BlurtEngine for iOS
        working-directory: blurt
        run: |
          xcodebuild -scheme BlurtEngine \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/BlurtEngine-iOS" \
            build

      # The provider package (and the AssemblyAI SDK it imports), which the
      # BlurtEngine scheme above no longer builds: the engine imports neither.
      - name: Build BlurtAssemblyAI for iOS
        working-directory: blurt
        run: |
          xcodebuild -scheme BlurtAssemblyAI \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/BlurtEngine-iOS" \
            build

      - name: Install XcodeGen and xcbeautify
        # Just the formulas this job uses, not `brew bundle --file=Brewfile`: the
        # iPhone app's project is the only thing it generates, and installing the
        # other tools would cost more than the build they precede. Both are in
        # the Brewfile too, so these are the versions check.sh uses.
        run: brew install xcodegen xcbeautify

      - name: Run the iPhone unit tests and build the probe
        working-directory: blurt
        # scripts/ios-check.sh's `test` and `probe` steps: BlurtiOSTests
        # (warnings as errors, BlurtiOSCore's coverage gate) on whichever iPhone
        # simulator the runner has (scripts/ios-lib.sh picks), then the probe's
        # XCUITest bundle compiled over that build. Ad hoc signing: the
        # simulator accepts it and, unlike no signing, it embeds the App Group
        # entitlement.
        # BLURT_SIM_FRESH: on a new simulator, not the image's (scripts/ios-lib.sh).
        run: BLURT_SIM_FRESH=1 BLURT_DERIVED_DATA="$RUNNER_TEMP/BlurtiOS" scripts/ios-check.sh test probe

  # The iPhone accessibility audits (BlurtiOSUITests, scripts/ios-uitest.sh):
  # every screen at the default and the largest text size, ~15 minutes of test
  # in all on top of the 8–10 a cold simulator costs a runner before its first
  # one. Two runners, by test, each auditing its half at both sizes: shard a
  # runs the tests it names, shard b skips them — so a new test lands in b with
  # no list to update, and a renamed one still runs there (ios-uitest.sh fails
  # a selection that ran nothing). Splitting by text size instead left the
  # largest size's runner, whose screens span the most pages, as the run's
  # long pole; and the default size riding ios-build's simulator made that the
  # long pole instead (Nov 2026).
  ios-audits:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    # ~17–20 minutes (Nov 2026): the boot and the build, then half the
    # audits at both sizes; 35 for a slow runner. Split by measured time, not
    # by count: b's six took 469 s to a's 340, so Words moved to a.
    # Rebalance from the "Executed N tests … in S seconds" line of each.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            selection: >-
              -only-testing:BlurtiOSUITests/AccessibilityAuditTests/testConsent
              -only-testing:BlurtiOSUITests/AccessibilityAuditTests/testHome
              -only-testing:BlurtiOSUITests/AccessibilityAuditTests/testImportTerms
              -only-testing:BlurtiOSUITests/AccessibilityAuditTests/testKeepOpen
              -only-testing:BlurtiOSUITests/AccessibilityAuditTests/testKeyEntry
              -only-testing:BlurtiOSUITests/AccessibilityAuditTests/testSettings
              -only-testing:BlurtiOSUITests/AccessibilityAuditTests/testWords
          - shard: b
            selection: >-
              -skip-testing:BlurtiOSUITests/AccessibilityAuditTests/testConsent
              -skip-testing:BlurtiOSUITests/AccessibilityAuditTests/testHome
              -skip-testing:BlurtiOSUITests/AccessibilityAuditTests/testImportTerms
              -skip-testing:BlurtiOSUITests/AccessibilityAuditTests/testKeepOpen
              -skip-testing:BlurtiOSUITests/AccessibilityAuditTests/testKeyEntry
              -skip-testing:BlurtiOSUITests/AccessibilityAuditTests/testSettings
              -skip-testing:BlurtiOSUITests/AccessibilityAuditTests/testWords

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Run the iPhone accessibility audits (shard ${{ matrix.shard }})
        working-directory: blurt
        env:
          SELECTION: ${{ matrix.selection }}
        run: |
          read -ra selection <<<"$SELECTION"
          BLURT_SIM_FRESH=1 BLURT_DERIVED_DATA="$RUNNER_TEMP/BlurtiOS" scripts/ios-uitest.sh "${selection[@]}"

      # The audits' result bundle when the job fails or times out, as ui-tests
      # keeps the Mac suite's: the log shows each failure's first line only,
      # and the bundle has the rest — every issue an audit raised, and the
      # screenshot of each screen it audited.
      - name: Upload the audits' results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BlurtiOSUITests-xcresult-${{ matrix.shard }}
          path: ${{ runner.temp }}/BlurtiOS/BlurtiOSUITests-*.xcresult
          if-no-files-found: ignore

  # The iPhone code's static gates: `swiftlint analyze` (every analyzer rule)
  # over a from-scratch build of the app and its tests — ios-check.sh's
  # `analyze` step builds them itself when run without `test`, no simulator
  # needed — then periphery's own build and scan. Off ios-build's critical
  # path, where analyze alone was 13.6 minutes.
  ios-static:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    # ~15 minutes (Nov 2026): the build, analyze split across the runner's
    # cores (scripts/swiftlint-analyze.sh), periphery; 35 for a slow runner.
    timeout-minutes: 35

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install the iPhone static gates' tools
        # xcodegen for the project, swiftlint for `swiftlint analyze`, periphery
        # for the unused-code scan, xcbeautify for the build output; all in the
        # Brewfile too, so these are the versions check.sh uses.
        run: brew install xcodegen swiftlint periphery xcbeautify

      - name: Run swiftlint analyze and periphery over the iPhone app
        working-directory: blurt
        run: BLURT_DERIVED_DATA="$RUNNER_TEMP/BlurtiOS" scripts/ios-check.sh analyze periphery

  # The iPhone suite under each sanitizer, as check.sh runs the engine's. A job
  # of its own, one runner per sanitizer, rather than more steps in ios-build:
  # each is a full instrumented rebuild, which would put it back on the run's
  # critical path. The coverage gate runs in ios-build's plain pass only.
  ios-sanitizers:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]

    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Run the iPhone unit tests under the ${{ matrix.sanitizer }} sanitizer
        working-directory: blurt
        env:
          BLURT_IOS_SANITIZER: ${{ matrix.sanitizer }}
        run: BLURT_SIM_FRESH=1 BLURT_DERIVED_DATA="$RUNNER_TEMP/BlurtiOS" scripts/ios-test.sh

  # The required status: branch protection on main requires a job named `check`,
  # and this is it. It used to be `gate`, beside a `check` job that ran all of
  # check.sh; the UI suite moved to `ui-tests` to run in parallel, which would
  # have left it behind no required status at all. Renaming this summary job to
  # `check` (and the old one to `macos`) puts every gate below behind the one
  # required context with no repo-settings change — `ios-build`,
  # `ios-sanitizers` and `lint` included, which `gate` asserted but nothing
  # required. `ios-audits` and `ios-static`, split out of `ios-build` to run
  # beside it, are asserted here too, so the split moved no gate out from
  # under the required status.
  #
  # Always-runs, so a *skipped* gate can't be mistaken for a pass. GitHub reports
  # a skipped required check to branch protection as successful, so anything that
  # makes a gate skip — the `changes` filter erroring, a `needs` failure — would
  # otherwise bypass it on a green-looking PR. This job runs whenever the run
  # wasn't cancelled — on a failed or skipped `needs` too — and fails unless each
  # gate either succeeded or was skipped *by design*: `lint` only for a docs-only
  # change (changes.outputs.code == 'false'), the Swift/iOS gates for a docs- or
  # evals-only one (changes.outputs.swift == 'false').
  #
  # `!cancelled()`, not `always()`: a push to a PR cancels the run before it
  # (as each merge once did on main, when `check` ran on push), and `always()`
  # then ran this job over the cancelled `needs` and failed it — red though no
  # test had failed. A superseded run ends cancelled, not failed.
  check:
    needs:
      [
        changes,
        lint,
        macos,
        mac-static,
        ui-tests,
        live-tests,
        ios-build,
        ios-audits,
        ios-static,
        ios-sanitizers,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert the lint, macOS, Mac-static, UI, live-hardware, iOS, iOS-audit, iOS-static and iOS-sanitizer gates ran or were intentionally skipped
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          MAC_STATIC_RESULT: ${{ needs.mac-static.result }}
          UI_RESULT: ${{ needs.ui-tests.result }}
          LIVE_RESULT: ${{ needs.live-tests.result }}
          IOS_RESULT: ${{ needs.ios-build.result }}
          IOS_AUDITS_RESULT: ${{ needs.ios-audits.result }}
          IOS_STATIC_RESULT: ${{ needs.ios-static.result }}
          IOS_SANITIZERS_RESULT: ${{ needs.ios-sanitizers.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          SWIFT_CHANGED: ${{ needs.changes.outputs.swift }}
        run: |
          echo "changes=$CHANGES_RESULT code=$CODE_CHANGED swift=$SWIFT_CHANGED lint=$LINT_RESULT macos=$MACOS_RESULT mac-static=$MAC_STATIC_RESULT ui-tests=$UI_RESULT live-tests=$LIVE_RESULT ios-build=$IOS_RESULT ios-audits=$IOS_AUDITS_RESULT ios-static=$IOS_STATIC_RESULT ios-sanitizers=$IOS_SANITIZERS_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "error: the changes filter did not succeed, so the gate cannot be trusted" >&2
            exit 1
          fi
          # One rule for every gate: green, or skipped only when the filter output
          # named in $3 says there was nothing for it to check. Written once so no
          # gate can drift into a looser reading than the others.
          assert_gate() {
            case "$2" in
              success) echo "$1 gate passed" ;;
              skipped)
                if [ "$3" = "false" ]; then
                  echo "$1 gate intentionally skipped (nothing in its scope changed)"
                else
                  echo "error: $1 gate was skipped but code in its scope changed" >&2
                  exit 1
                fi
                ;;
              *) echo "error: $1 gate result was '$2'" >&2; exit 1 ;;
            esac
          }
          assert_gate lint "$LINT_RESULT" "$CODE_CHANGED"
          assert_gate macOS "$MACOS_RESULT" "$SWIFT_CHANGED"
          assert_gate "Mac static" "$MAC_STATIC_RESULT" "$SWIFT_CHANGED"
          assert_gate "UI suite" "$UI_RESULT" "$SWIFT_CHANGED"
          assert_gate "live hardware" "$LIVE_RESULT" "$SWIFT_CHANGED"
          assert_gate iOS "$IOS_RESULT" "$SWIFT_CHANGED"
          assert_gate "iOS audits" "$IOS_AUDITS_RESULT" "$SWIFT_CHANGED"
          assert_gate "iOS static" "$IOS_STATIC_RESULT" "$SWIFT_CHANGED"
          assert_gate "iOS sanitizers" "$IOS_SANITIZERS_RESULT" "$SWIFT_CHANGED"
