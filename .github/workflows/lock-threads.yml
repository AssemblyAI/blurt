name: lock-threads

# Locks issues and PRs that have been closed and quiet for 180 days. A comment on
# a long-closed thread notifies nobody useful and usually describes a different
# problem on a newer Blurt; locking points people at a fresh issue instead
# (the bug template asks for the versions such a report needs). Collaborators
# can still comment on, or unlock, a locked thread.

on:
  schedule:
    # Weekly, Sunday 05:41 UTC.
    - cron: "41 5 * * 0"
  workflow_dispatch:

concurrency:
  group: lock-threads
  cancel-in-progress: false

permissions: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          process-only: issues, prs
          issue-inactive-days: 180
          pr-inactive-days: 180
          exclude-any-issue-labels: pinned, security
          issue-lock-reason: resolved
          pr-lock-reason: resolved
