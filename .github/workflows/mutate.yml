name: mutate

# Mutation testing (scripts/mutate.sh) on CI, sharded across macOS runners so the
# whole default target set finishes in one sitting instead of a laptop afternoon.
# Not a required check and not part of `check`: survivors need judgement (see the
# script's header). Run it by hand from the Actions tab; the `report` job lists
# every survivor and goes red while any remain, so a green run means every viable
# mutant was killed.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Space-separated target files (empty = mutate.sh's default set)"
        required: false
        default: ""

concurrency:
  group: mutate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shard:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Keep `count` equal to the number of entries in `index`.
        index: [1, 2, 3, 4, 5, 6, 7, 8]
        count: [8]
    steps:
      - name: Checkout blurt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: blurt
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Run mutate.sh
        working-directory: blurt
        env:
          SHARD: ${{ matrix.index }}/${{ matrix.count }}
          FILES: ${{ inputs.files }}
        # No --strict here: every shard finishes and uploads, and `report`
        # decides red/green over the whole set. The per-mutant test deadline
        # scales from this runner's own baseline run (see mutate.sh).
        run: |
          args=(--shard "$SHARD" --results mutate-results.tsv)
          if [ -n "${FILES:-}" ]; then args+=(--files "$FILES"); fi
          scripts/mutate.sh "${args[@]}"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutate-shard-${{ matrix.index }}
          path: blurt/mutate-results.tsv
          if-no-files-found: warn

  report:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download shard results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutate-shard-*
          path: shards

      # Each row: outcome, file, line, from, to (mutate.sh --results).
      - name: Report survivors
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          cat shards/*/mutate-results.tsv >all.tsv 2>/dev/null || : >all.tsv
          count() { awk -F'\t' -v o="$1" '$1 == o' all.tsv | wc -l | tr -d ' '; }
          killed=$(count killed); timeout=$(count timeout)
          survived=$(count survived); invalid=$(count invalid)
          {
            echo "## Mutation testing"
            echo
            echo "| killed | of which by timeout | survived | invalid (excluded) |"
            echo "| --- | --- | --- | --- |"
            echo "| $((killed + timeout)) | $timeout | $survived | $invalid |"
            if [ "$survived" -gt 0 ]; then
              echo
              echo "### Survivors"
              echo
              echo '```'
              awk -F'\t' '$1 == "survived" { printf "%s:%s  %s -> %s\n", $2, $3, $4, $5 }' all.tsv | sort
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "::error::a shard did not finish ($SHARD_RESULT) — the counts above are partial"
            exit 1
          fi
          if [ "$survived" -gt 0 ]; then
            echo "::error::$survived mutant(s) survived"
            exit 1
          fi
