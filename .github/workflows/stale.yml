name: stale

# Nudges, then closes, issues and PRs nobody has touched in a while, so the open
# lists stay a list of live work. Any comment, push or label change resets the
# clock and removes the `stale` label; closing is one click to undo.
#
# Deliberately aggressive, in line with other AI-first repos (anthropics/
# claude-code marks issues stale at 14 days and closes 14 days later, and closes
# needs-info issues after 7; openai/codex closes contributor PRs idle for 14):
#
#   issues       stale after 14 quiet days, closed 14 days later (28 in all)
#   needs-info   stale after 7 quiet days, closed 3 days later (10 in all)
#   PRs          stale after 7 quiet days, closed 7 days later (14 in all)
#
# Never touched: draft PRs (a parked prototype is deliberate), and anything
# labelled `pinned` (keep open regardless), `security`, or `accepted` (a request
# we've agreed to do, waiting on capacity rather than on its author).

on:
  schedule:
    # Daily, off the hour so it doesn't queue behind every other :00 cron.
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: stale
  cancel-in-progress: false

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # actions: write lets the action delete the cache it keeps its progress in
      # between runs; without it every run restarts from the oldest item.
      actions: write
      issues: write
      pull-requests: write
    steps:
      # Issues waiting on their author: the short clock. Runs first, so a
      # needs-info issue is marked at 7 days rather than waiting for the 14 below.
      - name: Issues waiting on their author (needs-info)
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          only-issue-labels: needs-info
          stale-issue-label: stale
          days-before-issue-stale: 7
          days-before-issue-close: 3
          days-before-pr-stale: -1
          days-before-pr-close: -1
          exempt-issue-labels: pinned,security,accepted
          close-issue-reason: not_planned
          stale-issue-message: >
            We asked for more information a week ago and haven't heard back, so
            this has been marked stale. It will close in 3 days unless you reply
            — your macOS and Blurt versions and the steps that trigger it are
            usually what's missing.
          close-issue-message: >
            Closing because the information we asked for didn't arrive. Reply
            with it and the issue can be reopened.
          operations-per-run: 50

      - name: Everything else
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-label: stale
          stale-pr-label: stale
          days-before-issue-stale: 14
          days-before-issue-close: 14
          days-before-pr-stale: 7
          days-before-pr-close: 7
          exempt-draft-pr: true
          exempt-issue-labels: pinned,security,accepted
          exempt-pr-labels: pinned,security
          close-issue-reason: not_planned
          stale-issue-message: >
            This issue has had no activity for 14 days, so it's been marked stale.
            It will close in 14 days unless there's new activity — a comment with
            more detail, or a note that it still affects you on the latest Blurt,
            keeps it open.
          close-issue-message: >
            Closing after 14 more days without activity. If this still happens on
            the latest Blurt, comment with your macOS and Blurt versions and it
            can be reopened.
          stale-pr-message: >
            This PR has had no activity for 7 days, so it's been marked stale. It
            will close in 7 days unless it's updated. If it's waiting on a
            review, say so in a comment; if it's parked on purpose, convert it to
            a draft.
          close-pr-message: >
            Closing after 7 more days without activity. The branch is untouched,
            so it can be reopened whenever work resumes.
          operations-per-run: 100
