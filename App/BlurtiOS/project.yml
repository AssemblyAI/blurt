# XcodeGen spec for Blurt on iPhone: the app (listens and transcribes) plus the
# keyboard it ships (drops the words into whatever app you are typing in).
#
# Like App/Blurt/project.yml this is the source of truth, but unlike it the
# generated BlurtiOS.xcodeproj is NOT committed: nobody opens a stale one, CI
# runs `xcodegen generate` right before it builds, and a local checkout does the
# same (`cd App/BlurtiOS && xcodegen generate`). The Info.plist and entitlements
# files below are generated from the `info:`/`entitlements:` blocks the same way.
#
# Two processes, one App Group. iOS lets no keyboard use the microphone, so the
# app records and talks to AssemblyAI while the keyboard is a remote control that
# inserts the result; they share `group.com.assemblyai.blurt.ios` (see
# BlurtiOSCore/SharedState.swift). Every id is AssemblyAI-owned
# (`com.assemblyai.blurt.ios…`); the team comes from $BLURT_TEAM, never this
# file. The Mac app keeps its own `dev.alex.blurt` ids: changing them would
# orphan its Sparkle updates and its granted Accessibility permission.
name: BlurtiOS
options:
  bundleIdPrefix: com.assemblyai
  deploymentTarget:
    # Matches Package.swift's `.iOS(.v18)`: an app floor below the package's fails
    # to resolve the dependency at all.
    iOS: "18.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    # iPhone first. iPad needs its own keyboard sizing pass.
    TARGETED_DEVICE_FAMILY: "1"
    # Whoever generates the project signs with their own team: XcodeGen expands
    # `${BLURT_TEAM}` from the environment (`BLURT_TEAM=XXXXXXXXXX xcodegen
    # generate`). Unset, it stays a reference that resolves to no team, which is
    # what CI wants — it builds with signing off. App Groups need a paid team.
    DEVELOPMENT_TEAM: ${BLURT_TEAM}
    CODE_SIGN_STYLE: Automatic
    # One package access identifier for every target, so BlurtiOSCore's
    # `package` declarations reach the app, the keyboard and the tests (and
    # nothing outside them) without becoming `public` API.
    SWIFT_PACKAGE_NAME: BlurtiOS
packages:
  # The same local package the Mac app carries, reached from App/BlurtiOS. No
  # remote packages: check.sh's dependency guard reads every App/*/project.yml.
  BlurtEngine:
    path: ../..
targets:
  # The iPhone code's logic, apart from its UI, the way BlurtEngine sits apart
  # from the Mac shell: the App Group contract, the keyboard's model and rules,
  # the voice state, term packs. No SwiftUI and no views (those stay in the app
  # and the keyboard), and no audio: the keyboard links this, and it never
  # hears anything. Static, so the app and the keyboard each carry their own
  # copy alongside the engine's, with no framework to embed and no second copy
  # of the engine inside one process. ios-test.sh gates its line coverage.
  BlurtiOSCore:
    type: framework.static
    platform: iOS
    sources:
      - path: BlurtiOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assemblyai.blurt.ios.core
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # The keyboard links it, so only extension-safe API.
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: BlurtEngine
        product: BlurtEngine
      # The AssemblyAI SDK library (the key validator's types live there).
      - package: BlurtEngine
        product: AssemblyAI
  # The component library: the generated design tokens, the type roles, the
  # brand colours, and the pieces every screen is built from (card, page, form,
  # eyebrow, button, wordmark, film grain). SwiftUI only — no BlurtiOSCore, no
  # engine — so it reads as the design system and nothing else. iPhone only for
  # now: the Mac app keeps its own Branding/. Static and extension-safe for the
  # reasons BlurtiOSCore is: the keyboard links it too.
  BlurtDesign:
    type: framework.static
    platform: iOS
    sources:
      - path: BlurtDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assemblyai.blurt.ios.design
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        APPLICATION_EXTENSION_API_ONLY: YES
  BlurtiOS:
    type: application
    platform: iOS
    sources:
      - path: BlurtiOS/Sources
      # The app's colour sets, generated from Design/tokens.json: the
      # system-drawn accent and the launch screen's page colour read them.
      - path: BlurtiOS/Assets.xcassets
      # Apple's required-reason declarations: App Group UserDefaults (1C8F.1)
      # and the bundle's own (CA92.1), the only such API either target uses.
      - path: BlurtiOS/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The app icon and wordmark both apps ship (Design/brand), shared rather
      # than copied: the Icon Composer file targets iOS too (`squares: shared`).
      - path: ../../Design/brand/AppIcon.icon
      - path: ../../Design/brand/blurt-ready-logo.png
        buildPhase: resources
      # The keyboard's views and model: the theme picker draws the real keyboard
      # on its cards, the home screen draws the orb and the meter, and debug
      # builds render every layout and state (KeyboardGalleryView) for design
      # work and screenshots. Only the extension's entry point stays out; the
      # keyboard itself never runs here.
      - path: BlurtKeyboard/Sources
        excludes:
          - KeyboardViewController.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assemblyai.blurt.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app-level accent, from the catalog, so system-drawn chrome and our
        # views agree (see the Mac's project.yml and BlurtBrand).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Warnings are failures for our own code, scoped to the target for the
        # reason App/Blurt/project.yml gives (the project base collides with the
        # -suppress-warnings Xcode applies to SPM packages).
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        # UI code defaults to the main actor (Swift 6.2), like the Mac shell;
        # the capture path and the App Group plumbing opt out with `nonisolated`.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    info:
      path: BlurtiOS/Info.plist
      properties:
        CFBundleDisplayName: Blurt
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Blurt listens only while you dictate, and sends that audio to AssemblyAI to turn it into text.
        # Keeps the listening window alive while the user is back in the app
        # they are typing in: iOS ends a backgrounded app's capture without it.
        UIBackgroundModes: [audio]
        # The icon zooms into this before the first frame: the app's own page
        # colour (Assets.xcassets › Page, light and dark), not a blank system
        # white that reads as a broken icon mid-launch.
        UILaunchScreen:
          UIColorName: Page
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # `blurt://start` — what the keyboard opens to bring the app forward, the
        # one moment iOS insists on before the microphone may open.
        CFBundleURLTypes:
          - CFBundleURLName: com.assemblyai.blurt.ios
            CFBundleURLSchemes: [blurt]
        # A shared key-term list (`.blurtterms`, JSON): declared so a tap on
        # one in Messages offers Blurt, which opens it as an import.
        # Not in place: iOS hands the app a copy in its Inbox, which
        # `TermPack.from` reads and then deletes — an import, never an edit of
        # the sender's file (and no security-scoped access to manage).
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Blurt key terms
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.assemblyai.blurt.terms]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.assemblyai.blurt.terms
            UTTypeDescription: Blurt key terms
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [blurtterms]
              public.mime-type: application/vnd.blurt.terms+json
    entitlements:
      path: BlurtiOS/BlurtiOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.assemblyai.blurt.ios]
    dependencies:
      - package: BlurtEngine
        product: BlurtEngine
      - target: BlurtiOSCore
        embed: false
      - target: BlurtDesign
        embed: false
      - target: BlurtKeyboard
  # The keyboard. It types, it starts and stops a dictation, it inserts the
  # words; it never hears anything. `RequestsOpenAccess` asks the user for Full
  # Access, which is what lets it reach the App Group and the app.
  BlurtKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: BlurtKeyboard/Sources
      - path: BlurtKeyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assemblyai.blurt.ios.keyboard
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: BlurtKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Blurt
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: BlurtKeyboard/BlurtKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.assemblyai.blurt.ios]
    dependencies:
      - package: BlurtEngine
        product: BlurtEngine
      - target: BlurtiOSCore
        embed: false
      - target: BlurtDesign
        embed: false
  # Unit tests for the iPhone code — BlurtiOSCore's logic, and what the app and
  # keyboard build on it — hosted by the app so `@testable import BlurtiOS`
  # reaches the shell too (the keyboard's sources are compiled into the app).
  # Core and BlurtDesign are linked into the host already, so the bundle only
  # imports them.
  # Swift Testing; `scripts/ios-test.sh` runs them on a simulator.
  BlurtiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BlurtiOSTests
      # The design's one source, bundled so DesignTokensTests can pin the
      # compiled DesignTokens.swift to the file it was generated from.
      - path: Design/tokens.json
        buildPhase: resources
      # The iPhone keyboard's measured geometry, so AppleGeometryTests can pin
      # the key/* tokens to what scripts/apple-geometry.sh read off the phone.
      - path: Design/apple-geometry.json
        buildPhase: resources
    dependencies:
      - target: BlurtiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assemblyai.blurt.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # The Apple-keyboard probe: one XCUITest that launches the app on
  # `-BlurtProbeField` and reads the system keyboard's key frames, so the
  # keyboard's geometry tokens are measured, not assumed
  # (scripts/apple-geometry.sh → Design/apple-geometry.json). Its own scheme,
  # so `xcodebuild test -scheme BlurtiOS` and the periphery scan never see it.
  BlurtiOSProbe:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BlurtiOSProbe
    dependencies:
      - target: BlurtiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.assemblyai.blurt.ios.probe
        TEST_TARGET_NAME: BlurtiOS
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
# XcodeGen emits a scheme only where one is declared, and `xcodebuild -scheme`
# needs a shared one. Building the app builds the keyboard it embeds; testing
# runs the unit tests against it.
schemes:
  BlurtiOS:
    build:
      targets:
        BlurtiOS: all
        BlurtiOSTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        # Serial, on purpose: tests swap `SharedStore.override` (a global) for a
        # scratch App Group, and an async test suspended mid-await would read
        # another suite's — or the real one — if a second ran in the gap.
        # `.serialized` only orders tests inside one suite.
        - name: BlurtiOSTests
          parallelizable: false
  BlurtiOSProbe:
    build:
      targets:
        BlurtiOS: all
        BlurtiOSProbe: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BlurtiOSProbe
